# Exam server + its Postgres. Judge workers run separately (see ../judge) and connect over HTTP.
#   cp .env.example .env   # fill in the four secrets
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: coding_exam_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"      # local only; the database is never exposed to the network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coding_exam_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coding_exam_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JUDGE_WORKER_TOKEN: ${APP_JUDGE_WORKER_TOKEN:?set APP_JUDGE_WORKER_TOKEN in .env}
      APP_INTEGRITY_SECRET: ${APP_INTEGRITY_SECRET:?set APP_INTEGRITY_SECRET in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      APP_REQUIRE_STRONG_SECRETS: ${APP_REQUIRE_STRONG_SECRETS:-false}   # true = refuse to start with placeholder secrets
      APP_CRYPTO_PRIVATE_KEY_PATH: /app/keys/ed25519_private.pem
      APP_CRYPTO_PUBLIC_KEY_PATH: /app/keys/ed25519_public.pem
    volumes:
      - crypto_keys:/app/keys
    restart: unless-stopped

volumes:
  postgres_data:
  crypto_keys:
