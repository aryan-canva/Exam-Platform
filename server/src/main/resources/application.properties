# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/coding_exam_platform
spring.datasource.username=postgres
spring.datasource.password=system
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
# Flyway owns the schema (db/migration). "none" = Hibernate never touches it; set SPRING_JPA_HIBERNATE_DDL_AUTO=validate to check entities against it.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
# CHANGE THIS to a 256-bit (32-byte) base64-encoded secret in production
app.jwt.secret=ThisIsAVerySecretKeyThatIsAtLeast256BitsLong1234567890ABCDEF
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ── Event integrity ───────────────────────────────────────────────────────────
# Each session's event-signing key = HMAC-SHA256(this secret, sessionId). CHANGE in production; changing it
# invalidates the key of every session that is still ACTIVE.
app.integrity.secret=${APP_INTEGRITY_SECRET:dev-integrity-secret-change-me}

# ── Crypto (Ed25519 key paths) ────────────────────────────────────────────────
# On first run, keys are auto-generated if these files don't exist.
app.crypto.private-key-path=keys/ed25519_private.pem
app.crypto.public-key-path=keys/ed25519_public.pem

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
server.address=0.0.0.0

# ── CORS ──────────────────────────────────────────────────────────────────────
# "*" lets the teacher UI on any device call the server (dev/LAN use).
# To restrict: app.cors.allowed-origins=http://<teacher-pc-ip>:5173
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

# ── Judge (remote workers pull jobs over HTTP) ────────────────────────────────
# Shared secret the judge workers send in the X-Worker-Token header.
app.judge.worker-token=${APP_JUDGE_WORKER_TOKEN:dev-worker-token}
# A claimed job is re-queued if the worker does not report back within this time.
app.judge.lease-seconds=${APP_JUDGE_LEASE_SECONDS:90}
app.judge.max-attempts=3
