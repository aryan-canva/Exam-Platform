spring.application.name=coding-exam-platform
server.port=8080

# ── Database ──────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/coding_exam_platform
spring.datasource.username=postgres
spring.datasource.password=system
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Flyway migrations ─────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────
app.jwt.secret=change-me-in-production-use-a-long-random-256-bit-secret-key
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ── Ed25519 Crypto Keys ───────────────────────────────────────
app.crypto.private-key-path=keys/ed25519_private.pem
app.crypto.public-key-path=keys/ed25519_public.pem

app.cors.allowed-origins=http://localhost:5173,http://<frontend-machine-ip>:5173