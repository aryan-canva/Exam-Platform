# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/coding_exam_platform
spring.datasource.username=postgres
spring.datasource.password=system
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
# CHANGE THIS to a 256-bit (32-byte) base64-encoded secret in production
app.jwt.secret=ThisIsAVerySecretKeyThatIsAtLeast256BitsLong1234567890ABCDEF
app.jwt.access-token-expiry-ms=900000
app.jwt.refresh-token-expiry-ms=604800000

# ── Crypto (Ed25519 key paths) ────────────────────────────────────────────────
# On first run, keys are auto-generated if these files don't exist.
app.crypto.private-key-path=keys/ed25519_private.pem
app.crypto.public-key-path=keys/ed25519_public.pem

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080
